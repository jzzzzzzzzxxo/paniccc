<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Panic Predictor</title>
<style>
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:#f4f6fb}
.header{background:#4f46e5;color:#fff;padding:18px 24px}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
input,select,button{padding:10px;border-radius:10px;border:1px solid #ddd}
input,select{width:100%;margin:6px 0}
button{background:#4f46e5;color:white;border:none;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.progress{height:22px;background:#e5e7eb;border-radius:999px;overflow:hidden}
#bar{height:100%;width:0%;background:#22c55e;transition:.4s}
.task{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8fafc;border-radius:10px;margin-top:8px}
.actions button{margin-left:6px}
#warning{display:none;color:#dc2626;font-weight:bold;margin-top:10px}
.auth{max-width:400px;margin:60px auto}
.hidden{display:none}
</style>
</head>
<body>

<div id="authPage" class="auth">
<div class="card">
<h2>Panic Predictor</h2>
<input id="name" placeholder="Name (signup only)">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
</div>
</div>

<div id="appPage" class="hidden">
<div class="header">
<h2>🧠 Panic Predictor</h2>
</div>

<div class="container">

<div class="card">
<h3>Welcome, <span id="username"></span></h3>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Panic Level</h3>
<div class="progress"><div id="bar"></div></div>
<p id="level">Low Risk</p>
<p id="warning">🚨 High workload detected. Start earlier to avoid panic studying.</p>
</div>

<div class="row">
<div class="card">
<h3>Add Task</h3>
<input id="title" placeholder="Task name">
<select id="type">
<option>Assignment</option>
<option>Quiz</option>
<option>Exam</option>
</select>
<input id="hours" type="number" placeholder="Estimated study hours">
<input id="dueDate" type="date">
<button onclick="addTask()">Add Task</button>
</div>

<div class="card">
<h3>Upcoming Tasks</h3>
<div id="taskList"></div>
</div>
</div>

</div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")||"[]");

function signup(){
 let users=JSON.parse(localStorage.getItem("users")||"[]");
 users.push({
  name:name.value,
  email:email.value,
  password:password.value
 });
 localStorage.setItem("users",JSON.stringify(users));
 alert("Account created.");
}

function login(){
 let users=JSON.parse(localStorage.getItem("users")||"[]");
 let user=users.find(u=>u.email===email.value && u.password===password.value);
 if(!user){alert("Invalid login");return;}
 localStorage.setItem("currentUser",JSON.stringify(user));
 showApp();
}

function showApp(){
 let user=JSON.parse(localStorage.getItem("currentUser"));
 if(!user)return;
 authPage.classList.add("hidden");
 appPage.classList.remove("hidden");
 username.textContent=user.name || "Student";
 render();
}

function logout(){
 localStorage.removeItem("currentUser");
 location.reload();
}

function addTask(){
 tasks.push({
  title:title.value,
  type:type.value,
  hours:Number(hours.value),
  dueDate:dueDate.value
 });
 save();
}

function editTask(i){
 let t=prompt("Edit task",tasks[i].title);
 if(t){tasks[i].title=t;save();}
}

function deleteTask(i){
 tasks.splice(i,1);
 save();
}

function save(){
 localStorage.setItem("tasks",JSON.stringify(tasks));
 render();
}

function render(){
 let html="";
 tasks.forEach((t,i)=>{
  html+=`<div class="task">
  <div>
  <b>${t.title}</b><br>
  ${t.type} • ${t.hours} hrs • Due ${t.dueDate}
  </div>
  <div class="actions">
  <button onclick="editTask(${i})">Edit</button>
  <button onclick="deleteTask(${i})">Delete</button>
  </div>
  </div>`;
 });
 taskList.innerHTML=html;
 calculateStress();
}

function calculateStress(){
 let score=0;
 let today=new Date();

 tasks.forEach(t=>{
  let due=new Date(t.dueDate);
  let days=Math.ceil((due-today)/86400000);

  let weight=t.hours||0;
  if(t.type==="Quiz") weight*=1.3;
  if(t.type==="Exam") weight*=2;

  if(days<=7) score+=weight;
 });

 score=Math.min(score,100);

 bar.style.width=score+"%";

 if(score<30){
  bar.style.background="#22c55e";
  level.textContent="Low Risk";
  warning.style.display="none";
 }
 else if(score<70){
  bar.style.background="#f59e0b";
  level.textContent="Medium Risk";
  warning.style.display="none";
 }
 else{
  bar.style.background="#ef4444";
  level.textContent="High Risk";
  warning.style.display="block";
 }
}

if(localStorage.getItem("currentUser")) showApp();
</script>

</body>
</html>
